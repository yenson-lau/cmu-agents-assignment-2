# `modal_key` links a role to the original Modal setup: the validator's model
# alias (VALIDATOR_MODEL), or the agent key in workflow/generate.py (AGENTS).
#
# `openrouter_provider` is sent as OpenRouter's provider-routing object: `order`
# pins the provider, `allow_fallbacks = false` keeps requests off other providers
# (and their quantizations), and `require_parameters = true` keeps `tools`
# requests off endpoints that would silently ignore them.

[validator]
modal_key = "validator"
openrouter_model = "qwen/qwen3-vl-30b-a3b-instruct"
openrouter_provider = { order = ["DeepInfra"], allow_fallbacks = false, require_parameters = true }

[agents.small]
modal_key = "qwen"
openrouter_model = "meta-llama/llama-3.1-8b-instruct"
openrouter_provider = { order = ["Groq"], allow_fallbacks = false, require_parameters = true }

[agents.medium]
modal_key = "ministral"
openrouter_model = "mistralai/ministral-14b-2512"
openrouter_provider = { order = ["Mistral"], allow_fallbacks = false, require_parameters = true }

[agents.large]
modal_key = "glm"
openrouter_model = "z-ai/glm-4.7-flash"
openrouter_provider = { order = ["Novita"], allow_fallbacks = false, require_parameters = true }
