# `provider` is sent as OpenRouter's provider-routing object: `order`
# pins the provider, `allow_fallbacks = false` keeps requests off other providers
# (and their quantizations), and `require_parameters = true` keeps `tools`
# requests off endpoints that would silently ignore them.

[validator]
model = "qwen/qwen3-vl-30b-a3b-instruct"
provider = { order = ["DeepInfra"], allow_fallbacks = false, require_parameters = true }

[agents.small]
model = "meta-llama/llama-3.1-8b-instruct"
provider = { order = ["Groq"], allow_fallbacks = false, require_parameters = true }

[agents.medium]
model = "mistralai/ministral-14b-2512"
provider = { order = ["Mistral"], allow_fallbacks = false, require_parameters = true }

[agents.large]
model = "z-ai/glm-4.7-flash"
provider = { order = ["Novita"], allow_fallbacks = false, require_parameters = true }
